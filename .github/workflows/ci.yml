name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format
        run: uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest -q
      - name: Evaluation
        # The eval runs in CI with no credentials and no model key: the keyword arm is
        # scored against the committed hand labels. Its failures are real and expected —
        # that arm exists to lose — so the report is uploaded rather than gating the build.
        run: uv run unlogged evaluate
             --engagement fixtures/engagement.json
             --events fixtures/events.jsonl
             --gold fixtures/gold.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: evals/

  # Stage One of the hackathon is pass/fail on a judge being able to run this. That is a
  # property of a clean checkout with no secrets, not of a developer machine, so it is
  # verified as one — with every credential explicitly unset rather than merely absent.
  judge-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --extra dev
      - name: LICENSE is present and detectable
        run: test -f LICENSE && head -1 LICENSE | grep -q "MIT License"
      - name: Tests, with no credentials
        env: { PAYPAL_CLIENT_ID: '', PAYPAL_CLIENT_SECRET: '', OPENAI_API_KEY: '' }
        run: uv run pytest -q
      - name: The README's own commands, with no credentials
        env: { PAYPAL_CLIENT_ID: '', PAYPAL_CLIENT_SECRET: '', OPENAI_API_KEY: '' }
        run: |
          uv run unlogged discover \
            --engagement fixtures/engagement.json \
            --events fixtures/events.jsonl \
            --invoice-id INV2-DEMO
          uv run unlogged evaluate \
            --engagement fixtures/engagement.json \
            --events fixtures/events.jsonl \
            --gold fixtures/gold.jsonl
      - name: Every claim in the README, checked
        env: { PAYPAL_CLIENT_ID: '', PAYPAL_CLIENT_SECRET: '', OPENAI_API_KEY: '' }
        run: uv run scripts/verify.py
      - name: The full apply flow replays from cassettes
        env: { PAYPAL_CLIENT_ID: '', PAYPAL_CLIENT_SECRET: '', OPENAI_API_KEY: '' }
        run: |
          uv run unlogged discover \
            --engagement fixtures/engagement.json \
            --events fixtures/events.jsonl \
            --invoice-id $(cat fixtures/demo-invoice-id) --apply

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
