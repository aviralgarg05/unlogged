# Hosted demo. Judging runs 1-15 December, and the Devpost guidance is that a project must stay
# testable free of charge until then — so the default path is cassette replay, which needs no
# PayPal credentials and no model key and therefore cannot break or run out of credit.
services:
  - type: web
    name: unlogged-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn unlogged.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: UNLOGGED_REPLAY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: unlogged-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npx next start --port $PORT --hostname 0.0.0.0
    envVars:
      # `host`, not `hostport`: these are two public web services, so the web half reaches the
      # API over https on 443, and a `host:10000` would point at a port that is not open.
      # Neither form carries a scheme and a blueprint cannot add one, so `lib/backend-origin`
      # puts https in front of a bare host. Without that the web half cannot reach its own API
      # — and `host:port` fails as a network error rather than a bad address, so it reads as
      # the API being down.
      - key: UNLOGGED_API
        fromService:
          name: unlogged-api
          type: web
          property: host
      - key: OPENAI_MODELS
        value: gpt-6.1-sol,gpt-5.4-mini
      # AG_STUDIO_OPENAI_API_KEY is set in the Render dashboard, never committed.
