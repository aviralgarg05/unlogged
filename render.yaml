# Hosted demo. Judging runs 1-15 December, and the Devpost guidance is that a project must stay
# testable free of charge until then — so the default path is cassette replay, which needs no
# PayPal credentials and no model key and therefore cannot break or run out of credit.
services:
  - type: web
    name: unlogged-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn unlogged.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: UNLOGGED_REPLAY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: unlogged-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npx next start --port $PORT --hostname 0.0.0.0
    envVars:
      - key: UNLOGGED_API
        fromService:
          name: unlogged-api
          type: web
          property: hostport
      - key: OPENAI_MODELS
        value: gpt-6.1-sol,gpt-5.4-mini
      # AG_STUDIO_OPENAI_API_KEY is set in the Render dashboard, never committed.
